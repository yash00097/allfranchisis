# Base44 sandbox/dev stack for AllFranchisis.
#
# Runs the Next.js dev server straight from the bind-mounted source (live reload),
# a local PostgreSQL for Prisma, and a one-shot setup service that installs
# dependencies, generates the Prisma client and applies migrations.
#
# Secrets for external services (Clerk, TMDB, Sentry) are delivered by the
# platform to /run/base44/app.env, which is mounted LAST so its values win.

services:
  db:
    image: postgres:17-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: allfranchisis
      POSTGRES_PASSWORD: allfranchisis
      POSTGRES_DB: allfranchisis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allfranchisis -d allfranchisis"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data

  setup:
    image: node:24-bookworm-slim
    working_dir: /app
    restart: "no"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://allfranchisis:allfranchisis@db:5432/allfranchisis
      DATABASE_URL_POOLED: postgresql://allfranchisis:allfranchisis@db:5432/allfranchisis
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        npm ci --no-audit --no-fund
        npx prisma generate
        npx prisma migrate deploy

  web:
    image: node:24-bookworm-slim
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://allfranchisis:allfranchisis@db:5432/allfranchisis
      DATABASE_URL_POOLED: postgresql://allfranchisis:allfranchisis@db:5432/allfranchisis
      NEXT_TELEMETRY_DISABLED: "1"
      # Sandbox preview wiring: the dev server must accept the proxied host and
      # the preview origin. Passed through from the sandbox environment.
      BASE44_PREVIEW_MODE:
      BASE44_PUBLIC_HOST_SUFFIX:
      BASE44_SANDBOX_HOST_DOMAIN:
    env_file:
      - /run/base44/app.env
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    command:
      - sh
      - -ec
      - exec npx next dev --hostname 0.0.0.0 --port 3000

volumes:
  db-data:
